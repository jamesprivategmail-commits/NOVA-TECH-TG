services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      # keep installed deps out of the bind mount so host doesn't clobber them
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - JWT_SECRET=${JWT_SECRET:-darkchat-firebase-jwt-secret-2026}
      - ADMIN_NOVA_IDS=${ADMIN_NOVA_IDS:-}
    command: sh -c "npm install --no-audit --no-fund && npx --yes nodemon --watch . --ext js,json server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

volumes:
  node_modules:
