<!-- ============================================================= -->
<!-- AUTH                                                          -->
<!-- ============================================================= -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo.jpg?v=2" alt="" class="auth-logo">
      <div>
        <div class="auth-title">DARK CHAT</div>
        <div class="auth-sub">Message your people, your way.</div>
      </div>
    </div>

    <div id="auth-error" class="alert alert-error hidden" role="alert"></div>

    <div id="nova-id-reveal" class="id-reveal hidden">
      <div class="id-reveal-label">Your DARK CHAT ID</div>
      <div class="id-reveal-value" id="revealed-nova-id"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="copy-id-btn">Copy ID</button>
      <div class="id-reveal-hint">Save this - it is how friends find you. Your password is the only lock on your account.</div>
      <button type="button" class="btn btn-primary btn-block" id="reveal-continue">Continue to DARK CHAT</button>
    </div>

    <form id="signup-form" class="auth-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Display name</span>
        <input type="text" id="signup-name" placeholder="What should people call you?" maxlength="60" required autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create my DARK CHAT ID</button>
    </form>

    <form id="login-form" class="auth-form hidden" autocomplete="off">
      <label class="field">
        <span class="field-label">DARK CHAT ID</span>
        <input type="text" id="login-novaid" placeholder="+1-626-715-0000" required autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
    </form>

    <div class="auth-toggle">
      <span id="toggle-to-login">Already have a DARK CHAT ID? <button type="button" class="link-btn">Log in</button></span>
      <span id="toggle-to-signup" class="hidden">New here? <button type="button" class="link-btn">Create an account</button></span>
    </div>
  </div>
</div>

<!-- ============================================================= -->
<!-- APP SHELL                                                     -->
<!-- ============================================================= -->
<div id="app" class="app hidden">

  <!-- CHATS -->
  <section class="screen screen-list active" id="screen-chats" data-screen="chats" aria-label="Chats">
    <header class="header">
      <div class="header-left">
        <button class="avatar-btn" id="me-avatar-btn" aria-label="Your profile">
          <span class="avatar avatar-sm" id="me-avatar"></span>
        </button>
        <div>
          <div class="header-title">DARK CHAT</div>
          <div class="header-sub" id="me-id-sub"></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="admin-btn" aria-label="Admin panel" title="Admin" hidden>
          <svg class="icon"><use href="#i-shield"></use></svg>
        </button>
        <button class="icon-btn" id="notifications-btn" aria-label="Notifications" title="Notifications">
          <svg class="icon"><use href="#i-bell"></use></svg>
          <span class="badge hidden" id="notif-badge">0</span>
        </button>
        <button class="icon-btn" id="new-chat-btn" aria-label="New chat" title="New chat">
          <svg class="icon"><use href="#i-plus"></use></svg>
        </button>
      </div>
    </header>
    <label class="search" for="chats-search">
      <svg class="icon"><use href="#i-search"></use></svg>
      <input id="chats-search" type="search" placeholder="Search conversations" autocomplete="off">
    </label>
    <div class="chips" id="chat-filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="unread">Unread</button>
      <button class="chip" data-filter="groups">Groups</button>
      <button class="chip" data-filter="channels">Channels</button>
    </div>
    <div class="content scroll" id="chats-list" aria-live="polite"></div>
  </section>

  <!-- STATUS -->
  <section class="screen screen-list" id="screen-status" data-screen="status" aria-label="Status" hidden>
    <header class="header">
      <div class="header-left">
        <div class="header-title">Status</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="new-status-btn" aria-label="Create status" title="Create status">
          <svg class="icon"><use href="#i-camera-plus"></use></svg>
        </button>
      </div>
    </header>
    <div class="content scroll" id="status-list" aria-live="polite"></div>
  </section>

  <!-- POSTS / UPDATES -->
  <section class="screen screen-list" id="screen-posts" data-screen="posts" aria-label="Updates" hidden>
    <header class="header">
      <div class="header-left"><div class="header-title">Updates</div></div>
    </header>
    <div class="content scroll" id="posts-list" aria-live="polite"></div>
  </section>

  <!-- DISCOVER -->
  <section class="screen screen-list" id="screen-discover" data-screen="discover" aria-label="Discover" hidden>
    <header class="header">
      <div class="header-left"><div class="header-title">Discover</div></div>
    </header>
    <label class="search" for="discover-search">
      <svg class="icon"><use href="#i-search"></use></svg>
      <input id="discover-search" type="search" placeholder="Search people by name or DARK CHAT ID" autocomplete="off">
    </label>
    <div class="content scroll" id="discover-list" aria-live="polite"></div>
  </section>

  <!-- PROFILE -->
  <section class="screen screen-list" id="screen-profile" data-screen="profile" aria-label="Profile" hidden>
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="profile-edit-btn" aria-label="Edit profile" title="Edit profile">
          <svg class="icon"><use href="#i-edit"></use></svg>
        </button>
        <div class="header-title">Profile</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="profile-settings-btn" aria-label="Settings" title="Settings">
          <svg class="icon"><use href="#i-settings"></use></svg>
        </button>
      </div>
    </header>
    <div class="content scroll" id="profile-content"></div>
  </section>

  <!-- CHAT (conversation) -->
  <section class="screen chat-screen" id="screen-chat" data-screen="chat" aria-label="Conversation" hidden>
    <header class="chat-header">
      <button class="icon-btn back" id="chat-back" aria-label="Back">
        <svg class="icon"><use href="#i-arrow-left"></use></svg>
      </button>
      <button class="chat-user" id="chat-user-btn">
        <span class="avatar avatar-sm" id="chat-avatar"></span>
        <span class="chat-user-info">
          <span class="chat-user-name truncate" id="chat-title"></span>
          <span class="chat-user-state truncate" id="chat-sub"></span>
        </span>
      </button>
      <div class="chat-header-actions">
        <button class="icon-btn" id="chat-call-btn" aria-label="Voice call" title="Voice call">
          <svg class="icon"><use href="#i-phone"></use></svg>
        </button>
        <button class="icon-btn" id="chat-video-btn" aria-label="Video call" title="Video call">
          <svg class="icon"><use href="#i-video"></use></svg>
        </button>
        <button class="icon-btn" id="chat-search-btn" aria-label="Search in conversation" title="Search in conversation">
          <svg class="icon"><use href="#i-search"></use></svg>
        </button>
        <button class="icon-btn" id="chat-more-btn" aria-label="Conversation options" title="Options">
          <svg class="icon"><use href="#i-more-vertical"></use></svg>
        </button>
      </div>
    </header>

    <div class="chat-searchbar hidden" id="chat-searchbar">
      <svg class="icon"><use href="#i-search"></use></svg>
      <input id="chat-search-input" type="search" placeholder="Search in conversation" autocomplete="off">
      <button class="icon-btn" id="chat-search-close" aria-label="Close search"><svg class="icon"><use href="#i-x"></use></svg></button>
    </div>

    <div class="pinned-bar hidden" id="pinned-bar"></div>

    <div class="messages scroll" id="messages" aria-live="polite"></div>

    <div class="typing-indicator hidden" id="typing-indicator"></div>

    <div class="reply-preview hidden" id="reply-preview">
      <div class="reply-preview-body">
        <span class="reply-preview-name" id="reply-preview-name"></span>
        <span class="reply-preview-text truncate" id="reply-preview-text"></span>
      </div>
      <button class="icon-btn" id="reply-cancel" aria-label="Cancel reply"><svg class="icon"><use href="#i-x"></use></svg></button>
    </div>

    <div class="attachment-preview hidden" id="attachment-preview">
      <div class="attachment-preview-inner" id="attachment-preview-inner"></div>
      <div class="attachment-progress" id="attachment-progress"><span></span></div>
      <button class="icon-btn" id="attachment-cancel" aria-label="Remove attachment"><svg class="icon"><use href="#i-x"></use></svg></button>
    </div>

    <form class="composer" id="composer">
      <textarea id="composer-input" class="composer-input" rows="1" placeholder="Message" aria-label="Message" autocomplete="off"></textarea>
      <button type="button" class="composer-icon-btn" id="composer-emoji" aria-label="Emoji"><svg class="icon"><use href="#i-smile"></use></svg></button>
      <button type="button" class="composer-icon-btn" id="composer-attach" aria-label="Attach"><svg class="icon"><use href="#i-paperclip"></use></svg></button>
      <button type="button" class="composer-icon-btn" id="composer-voice" aria-label="Record voice note"><svg class="icon"><use href="#i-mic"></use></svg></button>
      <button type="submit" class="send" id="send-btn" aria-label="Send">
        <svg class="icon"><use href="#i-send"></use></svg>
      </button>
      <input type="file" id="attach-input" class="hidden">
    </form>
  </section>

  <!-- CALL -->
  <section class="screen call-screen" id="screen-call" data-screen="call" aria-label="Call" hidden>
    <div class="call-top">
      <span class="call-peer-name truncate" id="call-peer-name"></span>
      <span class="call-mode" id="call-mode">VOICE</span>
    </div>
    <div class="call-stage" id="call-stage">
      <video id="remote-video" class="call-video remote hidden" autoplay playsinline></video>
      <video id="local-video" class="call-video local hidden" autoplay muted playsinline></video>
      <audio id="remote-audio" autoplay></audio>
      <div class="call-center" id="call-center">
        <div class="call-avatar-wrap">
          <div class="avatar avatar-xl" id="call-avatar"></div>
          <div class="call-pulse" aria-hidden="true"></div>
        </div>
        <div class="call-name" id="call-name"></div>
        <div class="call-state" id="call-state">Ringing...</div>
      </div>
    </div>
    <div class="call-controls" id="call-controls">
      <button class="call-btn" id="call-mute" aria-label="Mute microphone"><svg class="icon"><use href="#i-mic"></use></svg></button>
      <button class="call-btn" id="call-camera" aria-label="Toggle camera"><svg class="icon"><use href="#i-video"></use></svg></button>
      <button class="call-btn call-btn-danger" id="call-end" aria-label="End call"><svg class="icon"><use href="#i-phone-off"></use></svg></button>
    </div>
    <div class="call-incoming" id="call-incoming" hidden>
      <button class="call-btn call-btn-accept" id="call-accept" aria-label="Accept call"><svg class="icon"><use href="#i-phone"></use></svg></button>
      <button class="call-btn call-btn-danger" id="call-decline" aria-label="Decline call"><svg class="icon"><use href="#i-phone-off"></use></svg></button>
    </div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav active" data-tab="chats"><svg class="icon"><use href="#i-message-dot"></use></svg><small>Chats</small><span class="nav-dot hidden" id="nav-dot-chats"></span></button>
    <button class="nav" data-tab="status"><svg class="icon"><use href="#i-status"></use></svg><small>Status</small></button>
    <button class="nav" data-tab="posts"><svg class="icon"><use href="#i-updates"></use></svg><small>Updates</small></button>
    <button class="nav" data-tab="discover"><svg class="icon"><use href="#i-compass"></use></svg><small>Discover</small></button>
    <button class="nav" data-tab="profile"><svg class="icon"><use href="#i-user"></use></svg><small>Profile</small></button>
  </nav>
</div>

<!-- ============================================================= -->
<!-- OVERLAYS                                                      -->
<!-- ============================================================= -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet scroll" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="viewer" id="viewer" hidden></div>

<div class="toast-host" id="toast-host" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
